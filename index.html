.banner::after{content:none}
.banner img{display:none}
.banner b{display:none}
.avatar{width:128px;height:128px;object-fit:cover;image-rendering:pixelated;border-radius:50%;border:4px solid var(--duck);background:#8a0606;box-shadow:5px 5px 0 var(--ink);margin-top:-30px;position:relative;z-index:2}
h1{font-family:'Press Start 2P',monospace;font-size:17px;line-height:1.5;margin:22px 0 10px;color:var(--duck);text-align:center;text-shadow:3px 3px 0 var(--ink)}
.bio{margin:0 0 26px;text-align:center;font-size:15px;line-height:1.55;max-width:40ch}
.social{display:flex;gap:12px;width:100%;margin-bottom:26px}
.social a{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 10px;background:var(--duck);color:var(--ink);text-decoration:none;font-weight:800;font-size:16px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
svg{fill:currentColor;flex:none}
.social svg{width:24px;height:24px}
.links{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:14px}
.links a{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:800;font-size:17px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--orange)}
.links svg{width:28px;height:28px}
.links .heart{color:#d61f1f}
.links .wa{color:#1faa52}
.social a,.links a{transition:transform .08s,box-shadow .08s}
.social a:hover,.links a:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.credit{margin:44px 0 0;font-size:13px;color:var(--dim);text-align:center}
@media (prefers-reduced-motion:reduce){a{transition:none!important}}
